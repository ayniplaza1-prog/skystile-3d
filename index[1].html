<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Шаҳрофар — интерактивное 3D-демо</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
  #app { position:fixed; inset:0; background:linear-gradient(#dce7f2,#f3f7fb); }
  canvas { display:block; }

  /* Header */
  .topbar { position:fixed; top:0; left:0; right:0; padding:14px 20px; display:flex;
    align-items:center; gap:12px; z-index:10; pointer-events:none; }
  .logo { width:40px; height:40px; border-radius:10px; background:#2a6df4; color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:20px; }
  .title b { font-size:18px; color:#17324f; }
  .title span { display:block; font-size:12px; color:#5a7290; }

  /* Legend */
  .legend { position:fixed; top:14px; right:20px; z-index:10; background:#ffffffcc;
    backdrop-filter:blur(6px); border-radius:12px; padding:10px 14px; font-size:13px;
    box-shadow:0 6px 20px #0001; }
  .legend div { display:flex; align-items:center; gap:8px; margin:4px 0; color:#28415f; }
  .dot { width:14px; height:14px; border-radius:4px; }
  .d-free{ background:#27c07a; } .d-res{ background:#f3a81e; } .d-sold{ background:#e6534d; }

  .hint { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:10;
    background:#17324fcc; color:#fff; padding:8px 16px; border-radius:20px; font-size:13px; }

  /* Tooltip */
  #tip { position:fixed; z-index:20; pointer-events:none; background:#17324f; color:#fff;
    padding:6px 10px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .12s;
    white-space:nowrap; transform:translate(-50%,-140%); }

  /* Side panel */
  .panel { position:fixed; top:0; right:0; width:360px; max-width:85vw; height:100%; z-index:30;
    background:#fff; box-shadow:-10px 0 40px #0002; transform:translateX(105%);
    transition:transform .3s cubic-bezier(.2,.8,.2,1); display:flex; flex-direction:column; }
  .panel.open { transform:translateX(0); }
  .panel header { padding:18px 20px; background:#17324f; color:#fff; }
  .panel header b { font-size:18px; }
  .panel header span { display:block; font-size:13px; color:#aac4e2; margin-top:2px; }
  .panel .close { position:absolute; top:16px; right:16px; cursor:pointer; color:#fff;
    font-size:22px; line-height:1; background:none; border:none; }
  .list { flex:1; overflow-y:auto; padding:14px; }
  .card { border:1px solid #e6edf5; border-radius:12px; padding:12px 14px; margin-bottom:10px;
    display:flex; justify-content:space-between; align-items:center; }
  .card .info b { color:#17324f; font-size:15px; }
  .card .info small { display:block; color:#6a8099; margin-top:3px; }
  .badge { font-size:12px; font-weight:600; padding:4px 10px; border-radius:20px; color:#fff; }
  .b-free{ background:#27c07a; } .b-res{ background:#f3a81e; } .b-sold{ background:#e6534d; }

  .filters { position:fixed; left:20px; bottom:16px; z-index:10; display:flex; gap:8px; }
  .filters button { border:none; background:#ffffffcc; color:#28415f; padding:8px 14px;
    border-radius:20px; cursor:pointer; font-size:13px; box-shadow:0 4px 14px #0001; }
  .filters button.active { background:#2a6df4; color:#fff; }

  .loader { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    z-index:40; background:#f3f7fb; color:#5a7290; font-size:15px; }
</style>
</head>
<body>
<div id="app"></div>

<div class="topbar">
  <div class="logo">Ш</div>
  <div class="title"><b>Шаҳрофар</b><span>Интерактивное 3D-демо · г. Бохтар</span></div>
</div>

<div class="legend">
  <div><span class="dot d-free"></span> Свободна</div>
  <div><span class="dot d-res"></span> Забронирована</div>
  <div><span class="dot d-sold"></span> Продана</div>
</div>

<div class="filters">
  <button data-f="all" class="active">Все</button>
  <button data-f="free">Свободные</button>
</div>

<div class="hint">Перетащите — поворот · Колесо — масштаб · Нажмите на этаж</div>

<div id="tip"></div>

<aside class="panel" id="panel">
  <header>
    <b id="p-title">Этаж</b>
    <span id="p-sub"></span>
    <button class="close" id="p-close">&times;</button>
  </header>
  <div class="list" id="p-list"></div>
</aside>

<div class="loader" id="loader">Загрузка 3D-сцены…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
